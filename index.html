<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFG - Dagon Seikkan (1) Campus</title>
    <style>
        :root {
            --gold: #c9a050;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --cream: #fdf8f0;
            --cream-dark: #f5edd8;
            --warm-bg: #faf6ed;
            --text-dark: #3d2e14;
            --text-medium: #5c4425;
            --card-bg: #fffef9;
            --shadow-gold: rgba(139, 105, 20, 0.2);
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.06);
            --font-elegant: 'Georgia', 'Times New Roman', 'Noto Serif Myanmar', serif;
            --font-body: 'Segoe UI', 'Helvetica Neue', 'Noto Sans Myanmar', sans-serif;
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(170deg, #fdf8f0 0%, #f7f0e0 25%, #faf3e6 50%, #f5ead5 75%, #fdf8f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ BACKGROUND PARTICLES CONTAINER ============ */
        #particlesContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Falling Leaf */
        .falling-leaf {
            position: absolute;
            top: -60px;
            font-size: 1.4rem;
            opacity: 0.75;
            pointer-events: none;
            animation: leafFall linear infinite;
            filter: drop-shadow(0 2px 4px rgba(139, 105, 20, 0.2));
            z-index: 0;
        }

        @keyframes leafFall {
            0% {
                transform: translateY(-60px) translateX(0px) rotate(0deg) scale(1);
                opacity: 0.85;
            }
            15% {
                transform: translateY(12vh) translateX(35px) rotate(55deg) scale(1.05);
                opacity: 0.9;
            }
            30% {
                transform: translateY(26vh) translateX(-25px) rotate(120deg) scale(0.9);
                opacity: 0.8;
            }
            45% {
                transform: translateY(42vh) translateX(40px) rotate(190deg) scale(1.02);
                opacity: 0.75;
            }
            60% {
                transform: translateY(58vh) translateX(-35px) rotate(260deg) scale(0.88);
                opacity: 0.7;
            }
            75% {
                transform: translateY(74vh) translateX(30px) rotate(330deg) scale(0.95);
                opacity: 0.6;
            }
            90% {
                transform: translateY(90vh) translateX(-20px) rotate(380deg) scale(0.8);
                opacity: 0.4;
            }
            100% {
                transform: translateY(105vh) translateX(15px) rotate(430deg) scale(0.7);
                opacity: 0;
            }
        }

        /* Sparkle */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold-light);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleFloat linear infinite;
            box-shadow: 0 0 8px 2px rgba(224, 200, 120, 0.7), 0 0 16px 4px rgba(201, 160, 80, 0.4);
            z-index: 0;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(0px) scale(0);
                opacity: 0;
            }
            10% {
                transform: translateY(-10px) scale(1.2);
                opacity: 1;
            }
            40% {
                transform: translateY(-60px) scale(0.6);
                opacity: 0.7;
            }
            70% {
                transform: translateY(-120px) scale(0.2);
                opacity: 0.2;
            }
            100% {
                transform: translateY(-200px) scale(0);
                opacity: 0;
            }
        }

        /* Firefly */
        .firefly {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffe9a0 0%, #d4a840 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: fireflyDrift ease-in-out infinite;
            box-shadow: 0 0 14px 6px rgba(255, 220, 130, 0.6), 0 0 25px 10px rgba(200, 150, 50, 0.3);
            z-index: 0;
        }

        @keyframes fireflyDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(0.8);
                opacity: 0.5;
            }
            25% {
                transform: translate(30px, -40px) scale(1.3);
                opacity: 1;
            }
            50% {
                transform: translate(-20px, -80px) scale(0.7);
                opacity: 0.6;
            }
            75% {
                transform: translate(25px, -50px) scale(1.1);
                opacity: 0.9;
            }
        }

        /* ============ LOADING SCREEN ============ */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #fdf8f0 0%, #f5edd8 40%, #faf3e6 70%, #fdf8f0 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            pointer-events: all;
        }

        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-toys {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .loading-toy {
            font-size: 3rem;
            animation: toyBounce 0.7s ease-in-out infinite;
            display: inline-block;
            transition: transform 0.3s;
            cursor: default;
        }
        .loading-toy:nth-child(1) {
            animation-delay: 0s;
        }
        .loading-toy:nth-child(2) {
            animation-delay: 0.1s;
        }
        .loading-toy:nth-child(3) {
            animation-delay: 0.2s;
        }
        .loading-toy:nth-child(4) {
            animation-delay: 0.3s;
        }
        .loading-toy:nth-child(5) {
            animation-delay: 0.4s;
        }
        .loading-toy:nth-child(6) {
            animation-delay: 0.5s;
        }

        @keyframes toyBounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            25% {
                transform: translateY(-28px) scale(1.15);
            }
            50% {
                transform: translateY(0) scale(0.95);
            }
            75% {
                transform: translateY(-12px) scale(1.05);
            }
        }

        .loading-text {
            font-family: var(--font-elegant);
            font-size: 1.2rem;
            color: var(--gold-dark);
            letter-spacing: 2px;
            animation: loadingPulse 1.5s ease-in-out infinite;
            text-align: center;
        }

        @keyframes loadingPulse {
            0%,
            100% {
                opacity: 0.5;
                letter-spacing: 2px;
            }
            50% {
                opacity: 1;
                letter-spacing: 6px;
            }
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .loading-dot {
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            animation: dotBounce 0.6s ease-in-out infinite;
        }
        .loading-dot:nth-child(1) {
            animation-delay: 0s;
        }
        .loading-dot:nth-child(2) {
            animation-delay: 0.15s;
        }
        .loading-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes dotBounce {
            0%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-16px);
                opacity: 1;
            }
        }

        /* ============ MAIN CONTENT ============ */
        #mainContent {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            margin: 20px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        #mainContent.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 32px 44px;
            box-shadow: var(--shadow-soft), 0 0 0 1px rgba(201, 160, 80, 0.2), 0 20px 50px rgba(139, 105, 20, 0.1);
            text-align: center;
            position: relative;
            overflow: visible;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: all var(--transition-smooth);
        }

        .main-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 27px;
            padding: 3px;
            background: linear-gradient(135deg, #d4b060 0%, #f0d890 25%, #c9a050 50%, #e8cc78 75%, #b89430 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            opacity: 0.7;
            pointer-events: none;
        }

        .main-card::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 20px;
            border: 1px solid rgba(201, 160, 80, 0.18);
            pointer-events: none;
            z-index: 0;
        }

        /* Ornate corner decorations */
        .corner-decor {
            position: absolute;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.5;
            font-size: 1.6rem;
        }
        .corner-decor.top-left {
            top: 16px;
            left: 18px;
        }
        .corner-decor.top-right {
            top: 16px;
            right: 18px;
        }
        .corner-decor.bottom-left {
            bottom: 16px;
            left: 18px;
        }
        .corner-decor.bottom-right {
            bottom: 16px;
            right: 18px;
        }

        /* Logo Container */
        .logo-container {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin-bottom: 12px;
            animation: logoEntrance 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.3);
        }
        .logo-container.animate {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-15deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.08) rotate(3deg);
            }
            80% {
                transform: scale(0.94) rotate(-1deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .logo-img {
            max-width: 180px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 12px rgba(139, 105, 20, 0.25));
            transition: transform var(--transition-smooth), filter var(--transition-smooth);
        }
        .logo-img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 6px 20px rgba(139, 105, 20, 0.4));
        }

        .logo-fallback {
            display: none;
            font-family: var(--font-elegant);
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--gold-dark);
            letter-spacing: 6px;
            text-shadow: 0 3px 8px rgba(139, 105, 20, 0.3);
            padding: 10px 20px;
            background: linear-gradient(135deg, #fdf8f0, #f5edd8);
            border-radius: 16px;
            border: 2px solid var(--gold-light);
        }

        /* Campus Name */
        .campus-name {
            position: relative;
            z-index: 1;
            font-family: var(--font-elegant);
            font-size: 2rem;
            color: var(--text-dark);
            margin: 18px 0 8px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 2px 4px rgba(139, 105, 20, 0.1);
        }
        .campus-name.animate {
            opacity: 1;
            transform: translateY(0);
        }

        .campus-subtitle {
            position: relative;
            z-index: 1;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--text-medium);
            margin-bottom: 28px;
            letter-spacing: 1.5px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s;
            font-style: italic;
        }
        .campus-subtitle.animate {
            opacity: 1;
            transform: translateY(0);
        }

        /* Divider */
        .elegant-divider {
            position: relative;
            z-index: 1;
            width: 80%;
            max-width: 400px;
            height: 2px;
            margin: 0 auto 30px;
            background: linear-gradient(90deg, transparent, var(--gold-light) 20%, var(--gold) 50%, var(--gold-light) 80%, transparent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.6s ease 0.3s;
        }
        .elegant-divider.animate {
            opacity: 1;
        }

        .elegant-divider::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
            color: var(--gold);
            background: var(--card-bg);
            padding: 0 10px;
        }

        /* Buttons Container */
        .buttons-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            align-items: stretch;
        }

        /* Individual Button */
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            background: linear-gradient(135deg, #fffef9 0%, #fdf8f0 50%, #faf3e6 100%);
            border: 1.5px solid rgba(201, 160, 80, 0.35);
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.5px;
            transition: all var(--transition-bounce);
            box-shadow: 0 3px 12px rgba(139, 105, 20, 0.07);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            min-width: 150px;
            justify-content: center;
            opacity: 0;
            transform: translateY(25px);
        }
        .nav-btn.animate {
            opacity: 1;
            transform: translateY(0);
        }
        .nav-btn:nth-child(1).animate {
            transition-delay: 0.4s;
        }
        .nav-btn:nth-child(2).animate {
            transition-delay: 0.5s;
        }
        .nav-btn:nth-child(3).animate {
            transition-delay: 0.6s;
        }
        .nav-btn:nth-child(4).animate {
            transition-delay: 0.7s;
        }
        .nav-btn:nth-child(5).animate {
            transition-delay: 0.8s;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(224, 200, 120, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: 0;
        }

        .nav-btn:hover::before,
        .nav-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .nav-btn:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 28px rgba(139, 105, 20, 0.18), 0 0 0 4px rgba(201, 160, 80, 0.08);
            transform: translateY(-4px);
            background: linear-gradient(135deg, #ffffff 0%, #fefcf6 50%, #fdf8f0 100%);
            color: #2a1e0a;
        }
        .nav-btn:active {
            transform: translateY(-1px) scale(0.97);
            box-shadow: 0 3px 10px rgba(139, 105, 20, 0.12);
            transition: all 0.15s ease;
        }

        .btn-icon {
            font-size: 1.5rem;
            display: inline-block;
            z-index: 1;
            transition: transform var(--transition-bounce);
            flex-shrink: 0;
        }
        .nav-btn:hover .btn-icon {
            transform: scale(1.25) rotate(-8deg);
        }

        .btn-label {
            z-index: 1;
            position: relative;
        }

        /* Sparkle burst on hover */
        .nav-btn .hover-spark {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.5s ease;
        }
        .nav-btn:hover .hover-spark.spark-1 {
            opacity: 1;
            top: -8px;
            left: 15%;
            animation: sparkPop 0.6s ease forwards;
        }
        .nav-btn:hover .hover-spark.spark-2 {
            opacity: 1;
            top: -6px;
            right: 18%;
            animation: sparkPop 0.6s ease 0.1s forwards;
        }
        .nav-btn:hover .hover-spark.spark-3 {
            opacity: 1;
            bottom: -4px;
            left: 50%;
            animation: sparkPop 0.6s ease 0.2s forwards;
        }

        @keyframes sparkPop {
            0% {
                transform: scale(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-18px);
                opacity: 0;
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .main-card {
                padding: 28px 16px 32px;
                border-radius: 20px;
            }
            .main-card::before {
                border-radius: 23px;
            }
            .main-card::after {
                border-radius: 16px;
                inset: 6px;
            }
            .logo-img {
                max-width: 130px;
            }
            .logo-fallback {
                font-size: 2.4rem;
                letter-spacing: 4px;
            }
            .campus-name {
                font-size: 1.4rem;
                margin: 12px 0 4px;
            }
            .campus-subtitle {
                font-size: 0.8rem;
                margin-bottom: 20px;
            }
            .nav-btn {
                padding: 12px 16px;
                font-size: 0.85rem;
                border-radius: 40px;
                min-width: 120px;
                gap: 7px;
            }
            .btn-icon {
                font-size: 1.3rem;
            }
            .buttons-container {
                gap: 10px;
            }
            .corner-decor {
                width: 22px;
                height: 22px;
                font-size: 1.1rem;
            }
            .corner-decor.top-left {
                top: 10px;
                left: 10px;
            }
            .corner-decor.top-right {
                top: 10px;
                right: 10px;
            }
            .corner-decor.bottom-left {
                bottom: 10px;
                left: 10px;
            }
            .corner-decor.bottom-right {
                bottom: 10px;
                right: 10px;
            }
            .elegant-divider {
                margin-bottom: 22px;
            }
            .loading-toy {
                font-size: 2.2rem;
            }
            .loading-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 20px 10px 24px;
                border-radius: 16px;
            }
            .main-card::before {
                border-radius: 18px;
                inset: -2px;
            }
            .main-card::after {
                border-radius: 12px;
                inset: 4px;
            }
            .logo-img {
                max-width: 100px;
            }
            .logo-fallback {
                font-size: 1.8rem;
                letter-spacing: 3px;
                padding: 8px 14px;
            }
            .campus-name {
                font-size: 1.15rem;
                letter-spacing: 0.5px;
            }
            .campus-subtitle {
                font-size: 0.7rem;
                letter-spacing: 1px;
            }
            .nav-btn {
                padding: 10px 13px;
                font-size: 0.78rem;
                border-radius: 35px;
                min-width: 100px;
                gap: 5px;
            }
            .btn-icon {
                font-size: 1.1rem;
            }
            .buttons-container {
                gap: 8px;
            }
            .corner-decor {
                display: none;
            }
            .elegant-divider {
                margin-bottom: 16px;
                width: 90%;
            }
            .elegant-divider::after {
                font-size: 0.55rem;
                padding: 0 6px;
            }
            .loading-toy {
                font-size: 1.6rem;
            }
            .loading-toys {
                gap: 10px;
            }
            .loading-text {
                font-size: 0.85rem;
                letter-spacing: 1px;
            }
            body {
                padding: 8px;
            }
            #mainContent {
                margin: 8px;
            }
        }

        @media (min-width: 1200px) {
            .main-card {
                padding: 50px 44px 54px;
                border-radius: 28px;
            }
            .logo-img {
                max-width: 220px;
            }
            .campus-name {
                font-size: 2.4rem;
            }
            .nav-btn {
                padding: 16px 28px;
                font-size: 1rem;
                min-width: 170px;
            }
            .btn-icon {
                font-size: 1.7rem;
            }
            .buttons-container {
                gap: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== LOADING SCREEN ==================== -->
    <div id="loadingScreen" aria-hidden="false">
        <div class="loading-toys">
            <span class="loading-toy">🧸</span>
            <span class="loading-toy">🐰</span>
            <span class="loading-toy">🦊</span>
            <span class="loading-toy">🐻</span>
            <span class="loading-toy">🐼</span>
            <span class="loading-toy">🐣</span>
        </div>
        <p class="loading-text">Please wait, Mr.Zion is loading...</p>
        <div class="loading-dots">
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        </div>
    </div>

    <!-- ==================== BACKGROUND PARTICLES ==================== -->
    <div id="particlesContainer" aria-hidden="true"></div>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div id="mainContent">
        <div class="main-card">
            <!-- Ornate corner decorations -->
            <span class="corner-decor top-left">✦</span>
            <span class="corner-decor top-right">✦</span>
            <span class="corner-decor bottom-left">✦</span>
            <span class="corner-decor bottom-right">✦</span>

            <!-- Logo -->
            <div class="logo-container" id="logoContainer">
                <img
                class="logo-img"

                src="https://drive.google.com/uc?export=view&id=1wwepUptB-arMxRIOFL9wtaVeX6BEv5SZ"

                loading="eager"
                onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block';"
                >

            <!-- Campus Name -->
            <h1 class="campus-name" id="campusName">Dagon Seikkan (1) Campus</h1>

            <!-- Buttons -->
            <div class="buttons-container" id="buttonsContainer">
                <!-- Button 1: ALAUNG PHAYAR -->
                <button class="nav-btn" onclick="navigateTo('https://canva.link/p9bm61nf9vluoeu')" aria-label="ALAUNG PHAYAR">

                    <span class="hover-spark spark-2">💫</span>

                <!-- Button 2: BANDULA -->
                <button class="nav-btn" onclick="navigateTo('https://canva.link/uq937ngqqv0zf7u')" aria-label="BANDULA">
                    <span class="hover-spark spark-1">✨</span>
                    <span class="hover-spark spark-2">💫</span>
                    <span class="hover-spark spark-3">⭐</span>
                    <span class="btn-icon">🦁</span>
                    <span class="btn-label">BANDULA</span>
                </button>

                <!-- Button 3: KYANSITTHAR -->
                <button class="nav-btn" onclick="navigateTo('https://canva.link/zqyngeseknrp0yf')" aria-label="KYANSITTHAR">
                    <span class="hover-spark spark-1">✨</span>
                    <span class="hover-spark spark-2">💫</span>

                <!-- Button 4: BAYINNAUNG -->

    <script>
        (function() {
            // ============ DOM ELEMENTS ============
            const loadingScreen = document.getElementById('loadingScreen');
            const mainContent = document.getElementById('mainContent');
            const particlesContainer = document.getElementById('particlesContainer');
            const logoContainer = document.getElementById('logoContainer');
            const campusName = document.getElementById('campusName');
            const campusSubtitle = document.getElementById('campusSubtitle');
            const elegantDivider = document.getElementById('elegantDivider');
            const navBtns = document.querySelectorAll('.nav-btn');
            const efgLogo = document.getElementById('efgLogo');

            // ============ CREATE BACKGROUND PARTICLES ============
            function createFallingLeaves() {
                const leafEmojis = ['🍂', '🍃', '🌿', '🌸', '🍁', '🌺', '🪷', '💮'];
                const count = 28;

                for (let i = 0; i < count; i++) {
                    const leaf = document.createElement('span');
                    leaf.classList.add('falling-leaf');
                    leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
                    leaf.style.left = Math.random() * 95 + '%';
                    leaf.style.fontSize = (Math.random() * 1.4 + 0.8) + 'rem';
                    leaf.style.animationDuration = (Math.random() * 12 + 9) + 's';
                    leaf.style.animationDelay = (Math.random() * 14) + 's';
                    leaf.style.opacity = (Math.random() * 0.35 + 0.45);
                    particlesContainer.appendChild(leaf);
                }
            }

            function createSparkles() {
                const count = 22;
                for (let i = 0; i < count; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('sparkle');
                    sparkle.style.left = Math.random() * 94 + '%';
                    sparkle.style.top = Math.random() * 90 + '%';
                    sparkle.style.width = (Math.random() * 4 + 2) + 'px';
                    sparkle.style.height = sparkle.style.width;
                    sparkle.style.animationDuration = (Math.random() * 5 + 4) + 's';
                    sparkle.style.animationDelay = (Math.random() * 7) + 's';
                    particlesContainer.appendChild(sparkle);
                }
            }

            function createFireflies() {
                const count = 10;
                for (let i = 0; i < count; i++) {
                    const firefly = document.createElement('div');
                    firefly.classList.add('firefly');
                    firefly.style.left = Math.random() * 88 + '%';
                    firefly.style.top = Math.random() * 80 + '%';
                    firefly.style.animationDuration = (Math.random() * 8 + 6) + 's';
                    firefly.style.animationDelay = (Math.random() * 6) + 's';
                    particlesContainer.appendChild(firefly);
                }
            }

            createFallingLeaves();
            createSparkles();
            createFireflies();

            // ============ LOADING SEQUENCE ============
            const LOADING_DURATION = 2800; // 2.8 seconds

            function hideLoadingAndShowContent() {
                // Hide loading screen
                loadingScreen.classList.add('hidden');

                // Show main content
                setTimeout(() => {
                    mainContent.classList.add('visible');

                    // Staggered animations
                    requestAnimationFrame(() => {
                        logoContainer.classList.add('animate');
                    });

                    setTimeout(() => {
                        campusName.classList.add('animate');
                    }, 250);

                    setTimeout(() => {
                        campusSubtitle.classList.add('animate');
                    }, 400);

                    setTimeout(() => {
                        elegantDivider.classList.add('animate');
                    }, 500);

                    // Animate buttons
                    navBtns.forEach((btn, index) => {
                        setTimeout(() => {
                            btn.classList.add('animate');
                        }, 550 + index * 110);
                    });
                }, 150);
            }

            // Start loading sequence
            window.addEventListener('DOMContentLoaded', () => {
                // Preload logo image
                if (efgLogo && efgLogo.complete && efgLogo.naturalWidth > 0) {
                    // Image already cached
                }

                // Ensure minimum loading time for the cute animation
                setTimeout(hideLoadingAndShowContent, LOADING_DURATION);
            });

            // Fallback: if loading takes too long, show content anyway
            const maxLoadingTimeout = setTimeout(() => {
                if (!mainContent.classList.contains('visible')) {
                    hideLoadingAndShowContent();
                }
            }, LOADING_DURATION + 2000);

            // Clean up timeout if already loaded
            const originalHide = hideLoadingAndShowContent;
            hideLoadingAndShowContent = function() {
                clearTimeout(maxLoadingTimeout);
                originalHide();
            };

            // ============ NAVIGATION FUNCTION ============
            window.navigateTo = function(url) {
                // Add a subtle click feedback
                if (navigator.vibrate) {
                    navigator.vibrate(15);
                }

                // Open link in a new tab
                const newWindow = window.open(url, '_blank', 'noopener,noreferrer');

                // Fallback if popup blocked
                if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                    // Create a temporary anchor as fallback
                    const tempLink = document.createElement('a');
                    tempLink.href = url;
                    tempLink.target = '_blank';
                    tempLink.rel = 'noopener noreferrer';
                    tempLink.style.display = 'none';
                    document.body.appendChild(tempLink);
                    tempLink.click();
                    document.body.removeChild(tempLink);
                }
            };

            // ============ KEYBOARD ACCESSIBILITY ============
            navBtns.forEach((btn) => {
                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        btn.click();
                    }
                });
            });

            // ============ HANDLE LOGO IMAGE ERROR ============
            if (efgLogo) {
                efgLogo.addEventListener('error', function() {
                    this.style.display = 'none';
                    const fallback = document.getElementById('logoFallback');
                    if (fallback) {
                        fallback.style.display = 'block';
                    }
                });

                // Check if image loaded already
                if (efgLogo.complete && efgLogo.naturalWidth === 0) {
                    efgLogo.style.display = 'none';
                    const fallback = document.getElementById('logoFallback');
                    if (fallback) {
                        fallback.style.display = 'block';
                    }
                }
            }

            // ============ SERVICE WORKER REGISTRATION FOR OFFLINE CACHING (Optional) ============
            // This ensures the page works smoothly even with slow connections
            if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
                // Could register a service worker here for production
                // For now, we rely on browser cache
            }

            console.log('✨ EFG - Dagon Seikkan (1) Campus | Ready');
            console.log('🌿 ရှေးခေတ်မြန်မာ့ဂုဏ်ဆောင် · အစဉ်အလာခေတ်မီပညာရေး');
        })();
    </script>
</body>
