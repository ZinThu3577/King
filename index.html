<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFG International · Luxury Events</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ----- CSS Variables for Light/Dark Theme ----- */
        :root {
            /* Light theme (default) */
            --bg-body: #fcf8f2;
            --bg-gradient-start: #fcf6ed;
            --bg-gradient-end: #f5e6d3;
            --bg-splash: #fcf8f2;
            --text-primary: #2a2218;
            --text-muted: #6b5d4b;
            --card-bg: rgba(255, 252, 248, 0.70);
            --card-border: rgba(201, 160, 58, 0.15);
            --card-shadow: 0 40px 100px rgba(120, 80, 30, 0.08), 0 0 0 1px rgba(201, 160, 58, 0.08);
            --btn-bg: rgba(255, 255, 255, 0.4);
            --btn-border: rgba(201, 160, 58, 0.15);
            --btn-text: #2a2218;
            --btn-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            --social-bg: rgba(255, 255, 255, 0.3);
            --social-border: rgba(201, 160, 58, 0.08);
            --divider-color: rgba(201, 160, 58, 0.06);
            --scrollbar-track: #fcf8f2;
            --scrollbar-thumb: #c9a03a;
            --gold: #c9a03a;
            --gold-light: #e8c86a;
            --gold-dark: #a8842e;
            --gold-glow: #e4b84c;
            --gold-gradient: linear-gradient(135deg, #c9a03a, #f5d77a, #c9a03a);
            --gold-text: linear-gradient(135deg, #c9a03a, #e8c86a, #a8842e);
            /* Blob colors for light mode */
            --blob1: rgba(212, 175, 55, 0.15);
            --blob2: rgba(230, 200, 120, 0.10);
            --blob3: rgba(180, 150, 80, 0.08);
        }

        /* Dark theme */
        [data-theme="dark"] {
            --bg-body: #0f0c0a;
            --bg-gradient-start: #161210;
            --bg-gradient-end: #0f0c0a;
            --bg-splash: #0f0c0a;
            --text-primary: #f5f0eb;
            --text-muted: #b8aea5;
            --card-bg: rgba(20, 16, 14, 0.70);
            --card-border: rgba(201, 160, 58, 0.10);
            --card-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(201, 160, 58, 0.05);
            --btn-bg: rgba(255, 255, 255, 0.04);
            --btn-border: rgba(201, 160, 58, 0.10);
            --btn-text: #f5f0eb;
            --btn-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --social-bg: rgba(255, 255, 255, 0.04);
            --social-border: rgba(201, 160, 58, 0.06);
            --divider-color: rgba(201, 160, 58, 0.04);
            --scrollbar-track: #0f0c0a;
            --scrollbar-thumb: #a8842e;
            /* Blob colors for dark mode */
            --blob1: rgba(212, 175, 55, 0.12);
            --blob2: rgba(200, 170, 100, 0.08);
            --blob3: rgba(160, 130, 70, 0.06);
        }

        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg-body);
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            color: var(--text-primary);
        }

        /* ===== ANIMATED BLUR BACKGROUND (Blobs) ===== */
        .blob-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            will-change: transform, opacity;
            animation: floatBlob 20s ease-in-out infinite alternate;
            transition: background 0.8s ease;
        }

        .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: var(--blob1);
            animation-duration: 22s;
            animation-delay: 0s;
        }

        .blob:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -5%;
            right: -5%;
            background: var(--blob2);
            animation-duration: 26s;
            animation-delay: -6s;
        }

        .blob:nth-child(3) {
            width: 350px;
            height: 350px;
            top: 40%;
            left: 50%;
            background: var(--blob3);
            animation-duration: 18s;
            animation-delay: -12s;
        }

        .blob:nth-child(4) {
            width: 300px;
            height: 300px;
            top: 10%;
            right: 20%;
            background: var(--blob1);
            animation-duration: 24s;
            animation-delay: -8s;
            opacity: 0.6;
        }

        .blob:nth-child(5) {
            width: 250px;
            height: 250px;
            bottom: 20%;
            left: 10%;
            background: var(--blob2);
            animation-duration: 28s;
            animation-delay: -15s;
            opacity: 0.5;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            25% {
                transform: translate(60px, -80px) scale(1.1) rotate(5deg);
            }
            50% {
                transform: translate(-40px, 60px) scale(0.9) rotate(-3deg);
            }
            75% {
                transform: translate(80px, 40px) scale(1.05) rotate(4deg);
            }
            100% {
                transform: translate(-60px, -40px) scale(0.95) rotate(-5deg);
            }
        }

        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-splash);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease, visibility 1.2s ease, background 0.5s ease;
            text-align: center;
            padding: 2rem;
        }

        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 5.8rem);
            font-weight: 700;
            line-height: 1.1;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            transition: color 0.5s ease;
        }

        .splash-title .gold {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGold 3s ease-in-out infinite alternate;
        }

        @keyframes shimmerGold {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .splash-sub {
            font-size: clamp(1rem, 1.6vw, 1.5rem);
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 0.5rem;
            opacity: 0.8;
            transition: color 0.5s ease;
        }

        .splash-loader {
            margin-top: 3rem;
            width: 70px;
            height: 70px;
            position: relative;
        }

        .splash-loader::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(201, 160, 58, 0.15);
            border-top-color: var(--gold);
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        }

        .splash-loader::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px solid rgba(201, 160, 58, 0.05);
            border-top-color: var(--gold-light);
            animation: spin 1.8s cubic-bezier(0.6, 0, 0.4, 1) infinite reverse;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .splash-line {
            width: 140px;
            height: 2px;
            margin: 2.5rem auto 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 4px;
            animation: expandLine 2.4s ease-in-out infinite alternate;
        }

        @keyframes expandLine {
            0% {
                transform: scaleX(0.3);
                opacity: 0.2;
            }
            100% {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        /* ===== THEME TOGGLE BUTTON ===== */
        .theme-toggle-wrapper {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .theme-toggle {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 60px;
            padding: 0.6rem 1.2rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: var(--card-shadow);
            font-family: 'Inter', sans-serif;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
        }

        .theme-toggle .toggle-icon {
            font-size: 1.1rem;
            transition: transform 0.4s ease;
        }

        .theme-toggle:hover .toggle-icon {
            transform: rotate(20deg);
        }

        /* ===== MAIN CONTENT WRAPPER ===== */
        #main-content {
            opacity: 0;
            transition: opacity 1.6s ease 0.4s;
            width: 100%;
            max-width: 880px;
            position: relative;
            z-index: 2;
        }

        #main-content.visible {
            opacity: 1;
        }

        /* ===== LUXURY CARD ===== */
        .luxury-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-radius: 24px;
            padding: 3rem 2.8rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.6s ease, transform 0.4s ease, background 0.5s ease, border-color 0.5s ease;
        }

        .luxury-card:hover {
            box-shadow: 0 50px 120px rgba(120, 80, 30, 0.06), 0 0 0 1px rgba(201, 160, 58, 0.2);
            transform: translateY(-3px);
        }

        /* Interactive glow on card */
        .luxury-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(212, 175, 55, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .luxury-card:hover::before {
            opacity: 1;
        }

        .luxury-card>* {
            position: relative;
            z-index: 1;
        }

        /* Decorative gold corners */
        .deco-corner {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            opacity: 0.12;
            z-index: 0;
        }
        .deco-corner-tl {
            top: 15px;
            left: 15px;
            border-top: 1.5px solid var(--gold);
            border-left: 1.5px solid var(--gold);
        }
        .deco-corner-tr {
            top: 15px;
            right: 15px;
            border-top: 1.5px solid var(--gold);
            border-right: 1.5px solid var(--gold);
        }
        .deco-corner-bl {
            bottom: 15px;
            left: 15px;
            border-bottom: 1.5px solid var(--gold);
            border-left: 1.5px solid var(--gold);
        }
        .deco-corner-br {
            bottom: 15px;
            right: 15px;
            border-bottom: 1.5px solid var(--gold);
            border-right: 1.5px solid var(--gold);
        }

        /* ===== LOGO SECTION ===== */
        .logo-section {
            text-align: center;
            margin-bottom: 2.8rem;
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        /* ===== LOGO IMAGE with HIGH GLOW EFFECT ===== */
        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 160, 58, 0.2);
            box-shadow: 
                0 0 40px rgba(201, 160, 58, 0.15),
                0 0 80px rgba(201, 160, 58, 0.08),
                0 0 120px rgba(201, 160, 58, 0.04);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            background: var(--bg-body);
        }

        .logo-img:hover {
            transform: scale(1.05) rotate(-1deg);
            box-shadow: 
                0 0 60px rgba(201, 160, 58, 0.25),
                0 0 120px rgba(201, 160, 58, 0.12),
                0 0 180px rgba(201, 160, 58, 0.06);
        }

        .logo-img-fallback {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Playfair Display', serif;
            color: #2a2218;
            border: 2px solid rgba(201, 160, 58, 0.15);
            box-shadow: 0 0 60px rgba(201, 160, 58, 0.15);
        }

        .school-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            line-height: 1.2;
            margin-top: 0.2rem;
            transition: color 0.5s ease;
        }

        .school-name .gold-text {
            background: var(--gold-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .school-sub {
            font-size: clamp(0.9rem, 1.3vw, 1.1rem);
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: -0.3rem;
            opacity: 0.8;
            transition: color 0.5s ease;
        }

        .divider-gold {
            width: 100px;
            height: 2px;
            margin: 1rem auto 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 4px;
        }

        /* ===== EVENT BUTTONS ===== */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin: 2.5rem 0 2rem;
        }

        .event-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 1.8rem;
            background: var(--btn-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--btn-border);
            border-radius: 60px;
            color: var(--btn-text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--btn-shadow);
        }

        .event-btn .btn-icon {
            color: var(--gold);
            font-size: 1.3rem;
            width: 1.8rem;
            text-align: center;
            filter: drop-shadow(0 0 6px rgba(201, 160, 58, 0.3));
            transition: all 0.4s ease;
        }

        .event-btn .btn-text {
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--btn-text);
            transition: color 0.3s ease;
        }

        .event-btn .btn-glow {
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at center, rgba(201, 160, 58, 0.10), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .event-btn:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--gold);
            background: var(--btn-bg);
            box-shadow: 0 16px 50px rgba(201, 160, 58, 0.08);
        }

        .event-btn:hover .btn-icon {
            transform: translateX(4px) scale(1.15);
            color: var(--gold);
            filter: drop-shadow(0 0 15px rgba(201, 160, 58, 0.6)) drop-shadow(0 0 30px rgba(201, 160, 58, 0.2));
        }

        .event-btn:hover .btn-glow {
            opacity: 1;
        }

        .event-btn:active {
            transform: translateY(0px) scale(0.96);
        }

        /* ===== SOCIAL SECTION ===== */
        .social-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--divider-color);
            flex-wrap: wrap;
            transition: border-color 0.5s ease;
        }

        .social-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            font-weight: 400;
            opacity: 0.5;
            transition: color 0.5s ease;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--social-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--social-border);
            color: var(--text-primary);
            font-size: 1.4rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-link i {
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease, color 0.4s ease;
        }

        .social-link:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: var(--gold);
            box-shadow: 0 16px 50px rgba(201, 160, 58, 0.06);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:hover i {
            color: #2a2218;
            transform: scale(1.1);
        }

        .social-link:active {
            transform: translateY(0px) scale(0.95);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .luxury-card {
                padding: 2rem 1.5rem;
                border-radius: 18px;
            }
            .logo-img,
            .logo-img-fallback {
                width: 100px;
                height: 100px;
            }
            .events-grid {
                grid-template-columns: 1fr;
                gap: 0.9rem;
            }
            .event-btn {
                padding: 0.9rem 1.2rem;
                font-size: 0.95rem;
                justify-content: center;
            }
            .social-link {
                width: 46px;
                height: 46px;
                font-size: 1.2rem;
            }
            .deco-corner {
                width: 30px;
                height: 30px;
            }
            .splash-title {
                font-size: clamp(2.4rem, 10vw, 3.4rem);
            }
            .theme-toggle-wrapper {
                top: 1rem;
                right: 1rem;
            }
            .theme-toggle {
                padding: 0.4rem 0.9rem;
                font-size: 0.8rem;
            }
            /* Adjust blob sizes for mobile */
            .blob {
                filter: blur(60px);
            }
            .blob:nth-child(1) {
                width: 300px;
                height: 300px;
            }
            .blob:nth-child(2) {
                width: 250px;
                height: 250px;
            }
            .blob:nth-child(3) {
                width: 200px;
                height: 200px;
            }
            .blob:nth-child(4) {
                width: 180px;
                height: 180px;
            }
            .blob:nth-child(5) {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .luxury-card {
                padding: 1.5rem 1rem;
                border-radius: 14px;
            }
            .logo-img,
            .logo-img-fallback {
                width: 80px;
                height: 80px;
            }
            .school-name {
                font-size: 1.6rem;
            }
            .event-btn {
                padding: 0.75rem 1rem;
                font-size: 0.85rem;
                gap: 0.5rem;
            }
            .event-btn .btn-icon {
                font-size: 1.1rem;
                width: 1.6rem;
            }
            .social-section {
                gap: 1.2rem;
            }
            .theme-toggle-wrapper {
                top: 0.8rem;
                right: 0.8rem;
            }
            .theme-toggle {
                padding: 0.3rem 0.7rem;
                font-size: 0.7rem;
                gap: 0.3rem;
            }
            .blob {
                filter: blur(40px);
            }
            .blob:nth-child(1) {
                width: 200px;
                height: 200px;
            }
            .blob:nth-child(2) {
                width: 180px;
                height: 180px;
            }
            .blob:nth-child(3) {
                width: 150px;
                height: 150px;
            }
            .blob:nth-child(4) {
                width: 120px;
                height: 120px;
            }
            .blob:nth-child(5) {
                width: 100px;
                height: 100px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dark);
        }
    </style>
</head>
<body>

    <!-- ===== ANIMATED BLUR BACKGROUND (Blobs) ===== -->
    <div class="blob-bg">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ----- THEME TOGGLE -----
            const toggleBtn = document.getElementById('themeToggle');
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleLabel = document.getElementById('toggleLabel');
            const html = document.documentElement;

            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', savedTheme);
            updateToggleUI(savedTheme);

            toggleBtn.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateToggleUI(newTheme);
            });

            function updateToggleUI(theme) {
                if (theme === 'dark') {
                    toggleIcon.innerHTML = '<i class="fa-regular fa-sun"></i>';
                    toggleLabel.textContent = 'Light';
                } else {
                    toggleIcon.innerHTML = '<i class="fa-regular fa-moon"></i>';
                    toggleLabel.textContent = 'Dark';
                }
            }

            // ----- SPLASH SCREEN -----
            const splash = document.getElementById('splash');
            const mainContent = document.getElementById('main-content');

            function hideSplash() {
                if (!splash.classList.contains('hidden')) {
                    splash.classList.add('hidden');
                    mainContent.classList.add('visible');
                }
            }

            // Auto hide after 3.2s
            setTimeout(hideSplash, 3200);

            // Skip splash on click / tap
            splash.addEventListener('click', hideSplash);
            splash.addEventListener('touchstart', hideSplash, { passive: true });

            // Skip splash on Enter key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !splash.classList.contains('hidden')) {
                    hideSplash();
                }
            });

            // ----- LUXURY CARD : MOUSE-FOLLOW GLOW -----
            const card = document.getElementById('luxuryCard');

            card.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                this.style.setProperty('--x', x + '%');
                this.style.setProperty('--y', y + '%');
            });

            card.addEventListener('mouseleave', function() {
                this.style.setProperty('--x', '50%');
                this.style.setProperty('--y', '50%');
            });

            // ----- LOGO FALLBACK -----
            const logoImg = document.querySelector('.logo-img');
            const fallback = document.querySelector('.logo-img-fallback');
            if (logoImg) {
                logoImg.addEventListener('error', function() {
                    this.style.display = 'none';
                    if (fallback) fallback.style.display = 'flex';
                });
            }

            // ----- BUTTON TACTILE FEEDBACK -----
            const btns = document.querySelectorAll('.event-btn, .social-link');
            btns.forEach(function(btn) {
                btn.addEventListener('mousedown', function() {
                    this.style.transition = 'transform 0.08s ease';
                    this.style.transform = 'scale(0.96)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 120);
                });
            });

            // ----- CONSOLE GREETING -----
            console.log('%c✦ EFG International ✦', 'font-size:22px; font-weight:700; color:#c9a03a;');
            console.log('%cA radiant luxury experience.', 'font-size:14px; color:#6b5d4b;');

        })();
    </script>
